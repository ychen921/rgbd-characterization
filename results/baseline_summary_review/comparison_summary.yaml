interpretation_limits:
- nominal offsets are setup-relative differences, not sensor bias
- repeat error bars are sample standard deviations, not confidence intervals
- within-recording temporal variation is distinct from repeat variation
- ROI dimensions differ between conditions
- Scene 02 nominal yaw values are setup labels, not measured ground truth; tilt error
  includes setup-angle uncertainty
- Scene 02 fitted-plane distance is perpendicular to the plane and its nominal-distance
  offset is not a direct sensor-bias estimate
- metrics are not combined into a generic quality score
